// ─── Star rating ──────────────────────────────────────────────────
function StarRating({ rating, count }) {
  const full = Math.floor(rating);
  const half = rating - full >= 0.5;
  return (
    <div style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
      <div style={{ display: 'flex', gap: 2, color: charcoal }}>
        {Array.from({ length: 5 }, (_, i) => <StarIcon key={i} filled={i < full || (i === full && half)} />)}
      </div>
      <span style={{ fontSize: 12, color: warmGray }}>({count})</span>
    </div>
  );
}

// ─── Image with zoom (jak item.html) ─────────────────────────────
function ImageWithZoom({ src, alt, badge, colorHex = '#c0392b' }) {
  const [isZooming, setIsZooming] = useState(false);
  const [zoomPos, setZoomPos] = useState({ x: 50, y: 50 });
  const mainRef = useRef(null);

  const handleMouseMove = useCallback((e) => {
    if (!mainRef.current) return;
    const rect = mainRef.current.getBoundingClientRect();
    const x = ((e.clientX - rect.left) / rect.width) * 100;
    const y = ((e.clientY - rect.top) / rect.height) * 100;
    setZoomPos({ x, y });
  }, []);

  const bg = `radial-gradient(ellipse at 50% 55%, ${colorHex}44 0%, ${colorHex}22 35%, #ece9e2 65%)`;

  return (
    <div
      ref={mainRef}
      className="relative aspect-square overflow-hidden cursor-zoom-in"
      style={{ background: bg }}
      onMouseEnter={() => setIsZooming(true)}
      onMouseLeave={() => setIsZooming(false)}
      onMouseMove={handleMouseMove}
    >
      {badge && (
        <span className="absolute top-4 left-4 text-[9px] font-bold tracking-widest bg-charcoal text-white px-2.5 py-1 rounded-sm z-10">
          {badge}
        </span>
      )}
      <div
        className="absolute inset-0 transition-transform duration-200 ease-out"
        style={{
          transform: isZooming ? 'scale(2)' : 'scale(1)',
          transformOrigin: `${zoomPos.x}% ${zoomPos.y}%`,
        }}
      >
        <img src={src} alt={alt} className="w-full h-full object-cover" />
      </div>
    </div>
  );
}

            {/* Sizes */}
            <div>
              <span style={{ fontSize: 11, fontWeight: 600, textTransform: 'uppercase', letterSpacing: '0.06em', color: charcoal, display: 'block', marginBottom: 12 }}>
                Rozmiar (EU){selectedSize ? `: ${selectedSize}` : ''}
              </span>
              <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: 8 }}>
                {product.sizes.map(sz => (
                  <button key={sz} onClick={() => setSelectedSize(sz)}
                    style={{ height: 44, fontSize: 13, fontWeight: 500, border: selectedSize === sz ? `2px solid ${charcoal}` : '1px solid #e0ddd8', borderRadius: 8, background: selectedSize === sz ? charcoal : '#fff', color: selectedSize === sz ? '#fff' : charcoal, cursor: 'pointer', transition: 'all 0.15s' }}
                  >{sz}</button>
                ))}
              </div>
              {!selectedSize && <p style={{ fontSize: 10, color: warmGray, fontStyle: 'italic', margin: '8px 0 0' }}>Wybierz rozmiar, aby dodać do koszyka</p>}
            </div>

            {/* CTA buttons */}
            <button disabled={!selectedSize}
              style={{ width: '100%', padding: '14px', background: selectedSize ? charcoal : '#ccc', color: '#fff', border: 'none', borderRadius: 32, fontSize: 12, fontWeight: 600, textTransform: 'uppercase', letterSpacing: '0.06em', cursor: selectedSize ? 'pointer' : 'not-allowed', transition: 'background 0.2s' }}
            >
              {selectedSize ? `DODAJ DO KOSZYKA — ${product.price} zł` : 'WYBIERZ ROZMIAR'}
            </button>

            {/* AI Fitting Room button */}
            <button
              onClick={selectedSize ? onOpenFittingRoom : undefined}
              disabled={!selectedSize}
              style={{ width: '100%', padding: '13px', background: '#fff', color: selectedSize ? charcoal : '#aaa', border: `1.5px solid ${selectedSize ? charcoal : '#d1cec9'}`, borderRadius: 32, fontSize: 12, fontWeight: 600, textTransform: 'uppercase', letterSpacing: '0.06em', cursor: selectedSize ? 'pointer' : 'not-allowed', display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 8, transition: 'background 0.2s, border-color 0.2s, color 0.2s' }}
              onMouseEnter={e => { if (selectedSize) e.currentTarget.style.background = '#f5f4f1'; }}
              onMouseLeave={e => { if (selectedSize) e.currentTarget.style.background = '#fff'; }}
            >
              <SparkleIcon style={{ width: 15, height: 15 }} />
              {selectedSize ? 'PRZYMIERZALNIA AI' : 'WYBIERZ ROZMIAR, ABY PRZYMIERZYĆ'}
            </button>
          </div>

          <div style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>
            <p style={{ fontSize: 12, color: warmGray, margin: 0 }}>Darmowa dostawa dla zamówień powyżej 299 zł</p>
            <p style={{ fontSize: 12, color: warmGray, margin: 0 }}>Darmowe zwroty w ciągu 30 dni</p>
          </div>

          {/* Accordion */}
          <div style={{ borderTop: '1px solid #f0ede8' }}>
            {sections.map((sec, i) => (
              <AccordionItem key={i} title={sec.title} content={sec.content} isOpen={openAccordion === i} onToggle={() => setOpenAccordion(openAccordion === i ? null : i)} />
            ))}
          </div>
        </div>
      </div>
    </div>
  );
}

// ─── Fitting Room Modal ────────────────────────────────────────────
const PHASE = { IDLE: 'idle', CAMERA: 'camera', PREVIEW: 'preview', LOADING: 'loading', RESULT: 'result', ERROR: 'error' };

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

async function generateWithAI(photoBlob, apiKey) {
  const productRes = await fetch(product.image);
  const productBlob = await productRes.blob();

  const form = new FormData();
  form.append('model', 'gpt-image-1.5');
  form.append('image[]', photoBlob, 'photo.png');
  form.append('image[]', productBlob, 'suit.webp');
  form.append('prompt',
    'Dress this person in the suit shown in the second image. Keep the person\'s face, pose and body exactly the same. ' +
    'High-quality fashion editorial photography.'
  );
  form.append('n', '1');
  form.append('size', '1024x1536');

  const res = await fetch('https://api.openai.com/v1/images/edits', {
    method: 'POST',
    headers: { Authorization: `Bearer ${apiKey}` },
    body: form,
  });

  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(err.error?.message || `HTTP ${res.status}`);
  }

  const data = await res.json();
  const b64 = data.data[0].b64_json;
  const bytes = atob(b64);
  const ab = new ArrayBuffer(bytes.length);
  const ia = new Uint8Array(ab);
  for (let i = 0; i < bytes.length; i++) ia[i] = bytes.charCodeAt(i);
  return new Blob([ab], { type: 'image/png' });
}

// ─── Camera view ──────────────────────────────────────────────────
function CameraView({ onCapture, onCancel }) {
  const videoRef = useRef(null);
  const streamRef = useRef(null);
  const [ready, setReady] = useState(false);
  const [error, setError] = useState(null);

  useEffect(() => {
    navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false })
      .then(stream => {
        streamRef.current = stream;
        if (videoRef.current) { videoRef.current.srcObject = stream; videoRef.current.play(); setReady(true); }
      })
      .catch(() => setError('Nie można uzyskać dostępu do kamery.'));
    return () => streamRef.current?.getTracks().forEach(t => t.stop());
  }, []);

  const capture = () => {
    const video = videoRef.current;
    const canvas = document.createElement('canvas');
    canvas.width = video.videoWidth; canvas.height = video.videoHeight;
    const ctx = canvas.getContext('2d');
    ctx.translate(canvas.width, 0); ctx.scale(-1, 1); ctx.drawImage(video, 0, 0);
    canvas.toBlob(blob => { streamRef.current?.getTracks().forEach(t => t.stop()); onCapture(blob); }, 'image/png');
  };

  if (error) return (
    <div style={{ textAlign: 'center', padding: 24 }}>
      <p style={{ color: '#b94040', fontSize: 14 }}>{error}</p>
      <button onClick={onCancel} style={{ marginTop: 12, fontSize: 13, color: warmGray, background: 'none', border: 'none', cursor: 'pointer', textDecoration: 'underline' }}>Wróć</button>
    </div>
  );

  return (
    <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 16 }}>
      <div style={{ width: '100%', borderRadius: 12, overflow: 'hidden', background: '#000' }}>
        <video ref={videoRef} playsInline muted style={{ width: '100%', display: 'block', maxHeight: '65vh', objectFit: 'cover' }} />
        {!ready && <div style={{ padding: 40, textAlign: 'center' }}><p style={{ color: '#888', fontSize: 13 }}>Ładowanie kamery…</p></div>}
      </div>
      <div style={{ display: 'flex', gap: 10 }}>
        <button onClick={onCancel} style={{ padding: '10px 20px', border: '1px solid #d1cec9', borderRadius: 8, background: 'none', fontSize: 13, cursor: 'pointer', color: warmGray }}>Anuluj</button>
        <button onClick={capture} disabled={!ready} style={{ padding: '10px 20px', border: 'none', borderRadius: 8, background: charcoal, color: '#fff', fontSize: 13, fontWeight: 500, cursor: ready ? 'pointer' : 'not-allowed', opacity: ready ? 1 : 0.5, display: 'flex', alignItems: 'center', gap: 8 }}>
          <CameraIcon style={{ width: 15, height: 15 }} />Zrób zdjęcie
        </button>
      </div>
    </div>
  );
}

// ─── Upload zone ──────────────────────────────────────────────────
function UploadZone({ onFile }) {
  const inputRef = useRef(null);
  const [over, setOver] = useState(false);
  const handleDrop = (e) => { e.preventDefault(); setOver(false); const f = e.dataTransfer.files[0]; if (f?.type.startsWith('image/')) onFile(f); };
  return (
    <div className={`drop-zone ${over ? 'over' : ''}`}
      style={{ borderRadius: 12, padding: '32px 20px', cursor: 'pointer', display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 10, textAlign: 'center' }}
      onClick={() => inputRef.current.click()}
      onDragOver={e => { e.preventDefault(); setOver(true); }}
      onDragLeave={() => setOver(false)}
      onDrop={handleDrop}
    >
      <input ref={inputRef} type="file" accept="image/*" style={{ display: 'none' }} onChange={e => e.target.files[0] && onFile(e.target.files[0])} />
      <UploadIcon style={{ width: 28, height: 28, color: warmGray }} />
      <div>
        <p style={{ fontSize: 14, fontWeight: 500, color: charcoal, margin: '0 0 3px' }}>Przeciągnij zdjęcie lub kliknij</p>
        <p style={{ fontSize: 12, color: warmGray, margin: 0 }}>PNG, JPG lub WEBP — najlepiej całe ciało</p>
      </div>
    </div>
  );
}

// ─── Loading skeleton ─────────────────────────────────────────────
function LoadingView({ previewImageUrl }) {
  const steps = ["Analizuję Twoje zdjęcie…", "Nakładam garnitur…", "Dopasowuję proporcje…", "Finalizuję look…"];
  const [step, setStep] = useState(0);
  useEffect(() => {
    const t = setInterval(() => setStep(s => s < steps.length - 1 ? s + 1 : s), 1300);
    return () => clearInterval(t);
  }, []);

  return (
    <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 20 }}>
      <div style={{ position: 'relative', width: '100%', borderRadius: 12, overflow: 'hidden', maxHeight: '65vh' }}>
        <img src={previewImageUrl} alt="Podgląd" style={{ width: '100%', maxHeight: '65vh', objectFit: 'contain', display: 'block', filter: 'blur(2px)', transform: 'scale(1.03)' }} />
        <div className="shimmer" style={{ position: 'absolute', inset: 0, opacity: 0.55 }} />
        <div style={{ position: 'absolute', inset: 0, display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', gap: 10 }}>
          <svg className="spinner" viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth={1.5} style={{ width: 28, height: 28, filter: 'drop-shadow(0 1px 4px rgba(0,0,0,0.4))' }}>
            <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83" strokeLinecap="round"/>
          </svg>
          <p style={{ fontSize: 13, fontWeight: 500, color: '#fff', margin: 0, textShadow: '0 1px 6px rgba(0,0,0,0.5)' }}>{steps[step]}</p>
        </div>
      </div>
    </div>
  );
}

// ─── Result view ──────────────────────────────────────────────────
function ResultView({ imageUrl, resultBlob, onReset, onClose }) {
  const handleDownload = () => {
    const url = resultBlob ? URL.createObjectURL(resultBlob) : imageUrl;
    const a = document.createElement('a'); a.href = url; a.download = 'moj-look-fashionhero.png'; a.click();
    if (resultBlob) setTimeout(() => URL.revokeObjectURL(url), 60000);
  };

  return (
    <div className="fade-in" style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 16 }}>
      <div style={{ position: 'relative', width: '100%' }}>
        <img src={imageUrl} alt="Twój look" style={{ width: '100%', borderRadius: 12, display: 'block', maxHeight: '70vh', objectFit: 'contain', boxShadow: '0 8px 32px rgba(0,0,0,0.12)' }} />
        <button onClick={handleDownload} style={{ position: 'absolute', top: 10, right: 10, background: 'rgba(255,255,255,0.92)', border: 'none', borderRadius: 8, padding: '7px 12px', cursor: 'pointer', display: 'flex', alignItems: 'center', gap: 6, fontSize: 12, fontWeight: 500, color: charcoal }}>
          <DownloadIcon style={{ width: 13, height: 13 }} />Zapisz
        </button>
      </div>
      <p style={{ fontSize: 13, color: '#5c6b4f', fontWeight: 500, textAlign: 'center', margin: 0 }}>Świetnie wyglądasz w tym garniturze!</p>
      <div style={{ display: 'flex', gap: 10, flexWrap: 'wrap', justifyContent: 'center' }}>
        <button onClick={onReset} style={{ display: 'flex', alignItems: 'center', gap: 8, background: 'none', border: '1px solid #d1cec9', borderRadius: 8, padding: '10px 18px', cursor: 'pointer', fontSize: 13, color: warmGray }}>
          <RefreshIcon style={{ width: 13, height: 13 }} />Spróbuj z innym zdjęciem
        </button>
        <button onClick={onClose} style={{ display: 'flex', alignItems: 'center', gap: 8, background: charcoal, border: 'none', borderRadius: 8, padding: '10px 20px', cursor: 'pointer', fontSize: 13, fontWeight: 600, color: '#fff' }}>
          <CartIcon style={{ width: 15, height: 15 }} />Dodaj do koszyka
        </button>
      </div>
    </div>
  );
}

// ─── Fitting room content ─────────────────────────────────────────
function FittingRoomContent({ onClose }) {
  const apiKey = getUrlParam('openaikey');
  const [phase, setPhase] = useState(PHASE.IDLE);
  const [photoBlob, setPhotoBlob] = useState(null);
  const [resultUrl, setResultUrl] = useState(null);
  const [resultBlob, setResultBlob] = useState(null);
  const [errorMsg, setErrorMsg] = useState('');

  // In demo mode, keep a blob URL for the before-preview image
  const beforePreviewUrl = 'images/examplebefore.jpg';

  const handleFile = (file) => { setPhotoBlob(file); setPhase(PHASE.PREVIEW); };
  const handleCamera = (blob) => { setPhotoBlob(blob); setPhase(PHASE.PREVIEW); };

  const handleConfirm = async () => {
    setPhase(PHASE.LOADING);
    try {
      if (apiKey) {
        const blob = await generateWithAI(photoBlob, apiKey);
        const url = URL.createObjectURL(blob);
        setResultBlob(blob); setResultUrl(url);
      } else {
        await sleep(4000);
        setResultBlob(null); setResultUrl('images/exampleafter.jpg');
      }
      setPhase(PHASE.RESULT);
    } catch (e) {
      setErrorMsg(e.message || 'Nieznany błąd'); setPhase(PHASE.ERROR);
    }
  };

  const reset = () => {
    if (resultBlob && resultUrl) URL.revokeObjectURL(resultUrl);
    setPhotoBlob(null); setResultUrl(null); setResultBlob(null); setErrorMsg(''); setPhase(PHASE.IDLE);
  };

  // Preview image URL: real photo for AI mode, example for demo mode
  const previewImageUrl = apiKey
    ? (photoBlob ? URL.createObjectURL(photoBlob) : null)
    : beforePreviewUrl;

  return (
    <div>
      {/* Item being tried on */}
      <div style={{ display: 'flex', alignItems: 'center', gap: 14, padding: '14px 16px', border: '1px solid #e8e6e1', borderRadius: 10, backgroundColor: '#fafaf9', marginBottom: 24 }}>
        <img src="images/item.webp" alt="Garnitur Mario" style={{ width: 52, height: 52, objectFit: 'cover', borderRadius: 6, flexShrink: 0 }} />
        <div>
          <p style={{ fontSize: 11, color: warmGray, margin: '0 0 2px', textTransform: 'uppercase', letterSpacing: '0.06em' }}>Przymierzasz</p>
          <p style={{ fontSize: 14, fontWeight: 500, color: charcoal, margin: 0 }}>Garnitur w stylu Mario</p>
        </div>
      </div>

      {phase === PHASE.IDLE && (
        <div className="fade-in" style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
          <UploadZone onFile={handleFile} />
          <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
            <div style={{ flex: 1, height: 1, background: '#e8e6e1' }} />
            <span style={{ fontSize: 12, color: warmGray }}>lub</span>
            <div style={{ flex: 1, height: 1, background: '#e8e6e1' }} />
          </div>
          <button onClick={() => setPhase(PHASE.CAMERA)}
            style={{ width: '100%', display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 10, padding: '13px', border: '1px solid #d1cec9', borderRadius: 12, background: '#fff', fontSize: 14, fontWeight: 500, color: charcoal, cursor: 'pointer' }}
          >
            <CameraIcon style={{ width: 16, height: 16 }} />Zrób zdjęcie kamerą
          </button>
          {!apiKey && (
            <p style={{ textAlign: 'center', fontSize: 11, color: warmGray, margin: '4px 0 0' }}>
              Tryb demo — dodaj <code style={{ background: '#f0ede8', padding: '1px 5px', borderRadius: 4 }}>?openaikey=…</code> aby użyć prawdziwego AI
            </p>
          )}
        </div>
      )}

      {phase === PHASE.CAMERA && <CameraView onCapture={handleCamera} onCancel={reset} />}

      {phase === PHASE.PREVIEW && (
        <div className="fade-in" style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 16 }}>
          <img src={previewImageUrl} alt="Podgląd" style={{ width: '100%', maxHeight: '65vh', objectFit: 'contain', borderRadius: 12 }} />
          <div style={{ display: 'flex', gap: 10 }}>
            <button onClick={reset} style={{ padding: '10px 18px', border: '1px solid #d1cec9', borderRadius: 8, background: 'none', fontSize: 13, cursor: 'pointer', color: warmGray }}>
              Zmień zdjęcie
            </button>
            <button onClick={handleConfirm} style={{ padding: '10px 20px', border: 'none', borderRadius: 8, background: charcoal, color: '#fff', fontSize: 13, fontWeight: 500, cursor: 'pointer', display: 'flex', alignItems: 'center', gap: 8 }}>
              <SparkleIcon style={{ width: 14, height: 14 }} />Przymierz teraz
            </button>
          </div>
        </div>
      )}

      {phase === PHASE.LOADING && <LoadingView previewImageUrl={previewImageUrl} />}

      {phase === PHASE.RESULT && resultUrl && <ResultView imageUrl={resultUrl} resultBlob={resultBlob} onReset={reset} onClose={onClose} />}

      {phase === PHASE.ERROR && (
        <div className="fade-in" style={{ textAlign: 'center', padding: 24 }}>
          <p style={{ color: '#b94040', fontSize: 14 }}>Coś poszło nie tak: {errorMsg}</p>
          <button onClick={reset} style={{ marginTop: 12, display: 'inline-flex', alignItems: 'center', gap: 8, padding: '10px 18px', border: '1px solid #d1cec9', borderRadius: 8, background: 'none', fontSize: 13, color: warmGray, cursor: 'pointer' }}>
            <RefreshIcon style={{ width: 13, height: 13 }} />Spróbuj ponownie
          </button>
        </div>
      )}
    </div>
  );
}

// ─── Modal ────────────────────────────────────────────────────────
function FittingRoomModal({ isOpen, onClose }) {
  useEffect(() => {
    document.body.style.overflow = isOpen ? 'hidden' : '';
    return () => { document.body.style.overflow = ''; };
  }, [isOpen]);

  if (!isOpen) return null;

  return (
    <div className="modal-backdrop" onClick={onClose}>
      <div className="modal-sheet" onClick={e => e.stopPropagation()}>
        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 24 }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
            <SparkleIcon style={{ width: 16, height: 16, color: '#c9a84c' }} />
            <h2 style={{ fontSize: 15, fontWeight: 600, color: charcoal, margin: 0 }}>Przymierzalnia AI</h2>
          </div>
          <button onClick={onClose} style={{ background: 'none', border: 'none', cursor: 'pointer', color: warmGray, padding: 4, display: 'flex' }}>
            <CloseIcon style={{ width: 20, height: 20 }} />
          </button>
        </div>
        <FittingRoomContent onClose={onClose} />
      </div>
    </div>
  );
}

// ─── App ──────────────────────────────────────────────────────────
function App() {
  const [fittingOpen, setFittingOpen] = useState(false);
  return (
    <div style={{ minHeight: '100vh', backgroundColor: '#fff' }}>
      <AnnouncementBar />
      <Header />
      <ProductPage onOpenFittingRoom={() => setFittingOpen(true)} />
      <Footer />
      <FittingRoomModal isOpen={fittingOpen} onClose={() => setFittingOpen(false)} />
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
